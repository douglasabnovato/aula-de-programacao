<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Projetos | Aula de Programação</title>

    <meta
      name="description"
      content="Catálogo de 59 projetos práticos de desenvolvimento web, organizados por tecnologia — do primeiro Hello World a desafios de processo seletivo."
    />
    <meta name="theme-color" content="#0d1117" />

    <link rel="apple-touch-icon" sizes="180x180" href="./public/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png" />
    <link rel="manifest" href="./public/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="hub-content">
      <div class="controle">
        <h1 class="controle__titulo" id="contador">Carregando projetos…</h1>

        <div class="busca">
          <label for="campoBusca" class="sr-only" hidden>Buscar projeto</label>
          <input
            type="search"
            id="campoBusca"
            placeholder="Buscar por nome ou assunto…"
            autocomplete="off"
            aria-label="Buscar projeto"
          />
          <span class="busca__atalho" aria-hidden="true">/</span>
        </div>
      </div>

      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por tecnologia"></div>

      <div class="bento-grid" id="main-grid" aria-live="polite"></div>
    </main>

    <script src="./catalog.js"></script>
  </body>
</html>
