<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hub de Projetos | learnTECH</title>

    <meta
      name="description"
      content="Coleção viva de 59 projetos práticos de desenvolvimento web — do primeiro Hello World a desafios técnicos de processo seletivo."
    />
    <meta name="theme-color" content="#0d1117" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hub de Projetos | learnTECH" />
    <meta
      property="og:description"
      content="59 projetos práticos em HTML, CSS e JavaScript, documentando uma trajetória real de aprendizado."
    />
    <meta property="og:image" content="./assets/logo/hub-1-icon.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" sizes="180x180" href="./public/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png" />
    <link rel="manifest" href="./public/site.webmanifest" />

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="app-header">
      <div class="brand">
        <img
          src="./assets/logo/hub-2-icon.png"
          alt=""
          class="header-logo"
          width="48"
          height="48"
        />
        <h1>Learn<span>TECH</span> | Hub de Projetos</h1>
      </div>
    </header>

    <main class="hub-content">
      <div id="nexus-counter-container">
        <h2 id="project-count-text">Calculando projetos...</h2>
      </div>

      <div class="bento-grid" id="main-grid" aria-live="polite"></div>
    </main>

    <div id="project-viewer" role="dialog" aria-modal="true" aria-labelledby="project-title-display">
      <div id="viewer-progress"></div>
      <div class="viewer-header">
        <span id="project-title-display" style="font-weight: 700">Projeto</span>
        <button type="button" class="back-btn">
          <i class="fas fa-arrow-left" aria-hidden="true"></i> <span>Voltar ao Hub</span>
        </button>
      </div>
      <iframe id="project-iframe" src="" title="Projeto aberto no visor"></iframe>
    </div>

    <footer class="app-footer">
      <div class="footer-grid">
        <div class="footer-column footer-brand">
          <img
            src="./assets/logo/hub-1-icon.png"
            alt=""
            loading="lazy"
            decoding="async"
            width="72"
            height="72"
          />
          <p class="power-phrase">
            Uma coleção viva de projetos práticos — do primeiro "Hello World" a desafios
            técnicos de processo seletivo.
          </p>
        </div>

        <div class="footer-column">
          <h4>O Projeto</h4>
          <ul class="footer-links">
            <li>
              <a href="https://github.com/douglasabnovato/escola-de-programacao" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-code-branch" aria-hidden="true"></i> Repositório
              </a>
            </li>
            <li>
              <a href="https://douglasabnovato.github.io/ux-design/" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-paint-brush" aria-hidden="true"></i> UX Design
              </a>
            </li>
            <li>
              <a href="https://web.dev" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-book" aria-hidden="true"></i> Web.dev
              </a>
            </li>
          </ul>
        </div>

        <div class="footer-column">
          <h4>Redes Sociais</h4>
          <div class="social-icons">
            <a href="https://github.com/douglasabnovato" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
              <i class="fab fa-github" aria-hidden="true"></i>
            </a>
            <a href="https://www.linkedin.com/in/douglasabnovato/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
              <i class="fab fa-linkedin" aria-hidden="true"></i>
            </a>
            <a href="https://instagram.com/douglasabnovato" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <i class="fab fa-instagram" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; <span id="ano"></span> learnTECH | Hub de Projetos — Douglas A. B. Novato</p>
      </div>
    </footer>

    <script src="./catalog.js"></script>
    <script>
      document.getElementById("ano").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
