<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Prática 1 | Aula 2 - ByteClass</title>
    <!-- Vinculação do arquivo de estilos estruturado no Passo 2 e 9 -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Passo 4: Tag semântica principal envolvendo o componente -->
    <main class="profile-container">

        <!-- Passo 5: Container do Card usando tag semântica article -->
        <article class="profile-card">

            <!-- Passo 6: Imagem de Avatar -->
            <div class="avatar-wrapper">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80"
                    alt="Foto de Perfil do Aluno" class="profile-img">
            </div>

            <!-- Passo 7: Informações de Identidade (Nome e Cargo) -->
            <div class="profile-info">
                <h2>Mariana Costa</h2>
                <p class="role">Frontend Developer & UI Specialist</p>
                <p class="bio">Apaixonada por criar interfaces limpas, semânticas e acessíveis para a web moderna
                    utilizando HTML5, CSS3 e JavaScript.</p>
            </div>

            <!-- Passo 8: Lista semântica de redes sociais e conexões -->
            <ul class="social-links">
                <li><a href="#" target="_blank">GitHub</a></li>
                <li><a href="#" target="_blank">LinkedIn</a></li>
                <li><a href="#" target="_blank">Portfólio</a></li>
            </ul>

            <!-- Passo 9: Botão de Ação Principal (CTA) -->
            <div class="profile-action">
                <button class="btn-follow">Seguir Perfil</button>
            </div>

        </article>

    </main>

</body>

</html>
