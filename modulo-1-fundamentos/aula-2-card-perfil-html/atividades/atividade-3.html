<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Prática 3 | Aula 2 - ByteClass</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #0D1117;
            --bg-surface: #161B22;
            --primary-color: #00FF66;
            --primary-hover: #00cc52;
            --text-main: #FFFFFF;
            --text-muted: #8B949E;
            --border-color: #30363D;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-container {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Passo 1: Adicionando transição base no card */
        .profile-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 380px;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--primary-color);
            transition: background-color 0.3s ease;
        }

        /* Passo 2, 3, 4 e 5: Efeito de Hover, Elevação e Sombra Dinâmica */
        .profile-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(0, 255, 102, 0.12);
            border-color: var(--primary-color);
        }

        .avatar-wrapper {
            margin-bottom: 20px;
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            transition: transform 0.3s ease;
        }

        /* Zoom sutil na foto ao passar o mouse no card */
        .profile-card:hover .profile-img {
            transform: scale(1.05);
        }

        .profile-info h2 {
            font-size: 1.35rem;
            color: var(--text-main);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .profile-info .role {
            font-size: 0.88rem;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-info .bio {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Passo 6 e 7: Transições e interações nos links sociais */
        .social-links {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .social-links a {
            display: inline-block;
            padding: 6px 14px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-links a:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background-color: rgba(0, 255, 102, 0.05);
            transform: translateY(-2px);
        }

        /* Passo 8 e 9: Transição, micro-escala e active no Botão CTA */
        .profile-action .btn-follow {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--bg-main);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }

        .profile-action .btn-follow:hover {
            background-color: var(--primary-hover);
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(0, 255, 102, 0.25);
        }

        .profile-action .btn-follow:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <main class="profile-container">
        <article class="profile-card">
            
            <div class="avatar-wrapper">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80" alt="Avatar da Aluna" class="profile-img">
            </div>

            <div class="profile-info">
                <h2>Mariana Costa</h2>
                <p class="role">Frontend Developer</p>
                <p class="bio">Desenvolvedora especializada na criação de interfaces escaláveis, responsivas e focadas na experiência do usuário.</p>
            </div>

            <ul class="social-links">
                <li><a href="#">GitHub</a></li>
                <li><a href="#">LinkedIn</a></li>
                <li><a href="#">Portfólio</a></li>
            </ul>

            <div class="profile-action">
                <button class="btn-follow">Seguir Perfil</button>
            </div>

        </article>
    </main>

</body>
</html>
