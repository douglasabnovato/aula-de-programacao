<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Thumbnail Aula 3 - Git Bash - ByteClass</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap');

        body {
            margin: 0;
            width: 1280px;
            height: 720px;
            background-color: #0D1117;
            background-image: 
                radial-gradient(circle at 85% 80%, rgba(0, 255, 102, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 10% 20%, rgba(0, 255, 102, 0.07) 0%, transparent 40%),
                linear-gradient(rgba(13, 17, 23, 0.85), rgba(13, 17, 23, 0.95));
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 55px 75px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .top-glow-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: #00FF66;
            box-shadow: 0 0 20px #00FF66;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
        }

        .badge-trilha {
            background-color: rgba(0, 255, 102, 0.08);
            color: #00FF66;
            border: 2px solid rgba(0, 255, 102, 0.4);
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .main-content {
            z-index: 2;
            margin-top: 10px;
        }

        .main-title {
            color: #FFFFFF;
            font-size: 4rem;
            font-weight: 900;
            line-height: 1.12;
            text-transform: uppercase;
            max-width: 1100px;
            letter-spacing: -1px;
        }

        .main-title span {
            color: #00FF66;
            display: block;
            text-shadow: 0 0 30px rgba(0, 255, 102, 0.25);
        }

        .footer {
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(48, 54, 61, 0.8);
            padding-top: 20px;
            color: #8B949E;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer .highlight {
            color: #00FF66;
        }
    </style>
</head>
<body>
    <div class="top-glow-bar"></div>

    <div class="header">
        <img src="byteclass-dev-2.jpg" alt="Logo ByteClass" class="logo-img">
        <div class="badge-trilha">AULA EXPERIMENTAL 03</div>
    </div>

    <div class="main-content">
        <div class="main-title">
            DOMINANDO O GIT BASH:
            <span>PRIMEIROS PASSOS NO TERMINAL</span>
        </div>
    </div>

    <div class="footer">
        <div>ECOSSISTEMA LEARTECH &nbsp;•&nbsp; <span class="highlight">VERSIONAMENTO E TERMINAL</span></div>
        <div>BYTECLASS DEV</div>
    </div>
</body>
</html>
