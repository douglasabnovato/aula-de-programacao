<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Thumbnail Aula 1 - ByteClass</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap');

        body {
            margin: 0;
            width: 1280px;
            height: 720px;
            background-color: #0D1117;
            background-image: radial-gradient(circle at 90% 85%, rgba(0, 255, 102, 0.18) 0%, transparent 45%),
                              radial-gradient(circle at 10% 15%, rgba(0, 255, 102, 0.08) 0%, transparent 40%);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 55px 70px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Faixa superior verde neon com alinhamento tech */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 16px;
            background-color: #00FF66;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            margin-top: 10px;
        }

        /* Container da Logo Oficial */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 65px;
            width: auto;
            object-fit: contain;
        }

        /* Badge Estilizada de Aula Experimental */
        .badge-aula {
            background-color: rgba(0, 255, 102, 0.1);
            color: #00FF66;
            border: 2px solid #00FF66;
            padding: 10px 24px;
            border-radius: 35px;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-content {
            z-index: 2;
            margin-top: 10px;
        }

        .main-title {
            color: #FFFFFF;
            font-size: 4.2rem;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            max-width: 1050px;
            letter-spacing: -1.5px;
        }

        .main-title span {
            color: #00FF66;
            display: block;
            margin-top: 5px;
        }

        .footer {
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #8B949E;
            font-size: 1rem;
            font-weight: 700;
            border-top: 1px solid rgba(48, 54, 61, 0.7);
            padding-top: 22px;
            letter-spacing: 0.5px;
        }

        .footer span {
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div class="top-bar"></div>

    <div class="header">
        <div class="logo-container">
            <!-- Insira a imagem da logo na mesma pasta ou use o caminho correto -->
            <img src="byteclass-dev-1.jpg" alt="Logo ByteClass" class="logo-img">
        </div>
        <div class="badge-aula">Aula Experimental 01</div>
    </div>

    <div class="main-content">
        <div class="main-title">
            Lista de Instalações e
            <span>Softwares</span>
        </div>
    </div>

    <div class="footer">
        ECOSSISTEMA LEARTECH &nbsp;•&nbsp; <span>AMBIENTE DE DESENVOLVIMENTO DE SOFTWARE</span>
    </div>
</body>
</html>
